<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CANB 면제권 편집기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');

:root{
  --key:#4d6b8a;
  --key-deep:#263b4d;
  --key-main:#4d6b8a;
  --key-mid:#9aabba;
  --key-soft:#e2e8ed;
  --key-pale:#f3f6f8;
  --ink:#17222c;
  --muted:#65727d;
  --line:#b4bec6;
  --paper:#fdfcf9;
  --screen:#e9edf0;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--screen);color:var(--ink)}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

.app{
  max-width:1320px;
  margin:0 auto;
  padding:24px 20px;
  display:grid;
  grid-template-columns:270px 1fr;
  gap:24px;
  align-items:start;
}

.panel{
  position:sticky;
  top:24px;
  background:rgba(255,255,255,.96);
  border:1px solid #dbe1e6;
  border-radius:16px;
  padding:20px;
  box-shadow:0 18px 45px rgba(36,49,60,.08);
}
.panel-head{padding-bottom:17px;margin-bottom:17px;border-bottom:1px solid #edf0f2}
.panel h1{margin:0 0 5px;font-size:19px;font-weight:800;color:#17222c;letter-spacing:-.045em}
.panel-head p{margin:0;font-size:11px;font-weight:500;line-height:1.55;color:#7b8791;letter-spacing:-.02em}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:7px;font-size:11px;font-weight:700;color:#5b6771;letter-spacing:-.015em}
.field input[type="text"]{
  width:100%;height:42px;padding:0 12px;border:1px solid #d5dce1;border-radius:9px;background:#fbfcfd;
  color:#1d2933;font:500 13px/1.2 'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;outline:none;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease
}
.field input[type="text"]:hover{background:#fff;border-color:#c3ccd3}
.field input[type="text"]:focus{background:#fff;border-color:var(--key-main);box-shadow:0 0 0 3px color-mix(in srgb,var(--key-main) 14%,transparent)}
.color-row{display:grid;grid-template-columns:1fr 46px;gap:8px}
.color-row input[type="color"]{width:46px;height:42px;padding:4px;border:1px solid #d5dce1;border-radius:9px;background:#fbfcfd;cursor:pointer}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:19px}
button{height:42px;border:0;border-radius:9px;cursor:pointer;font:700 12px/1 'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0)}
.reset{background:#edf1f4;color:#4e5b65}.reset:hover{background:#e5eaee}
.print{background:#1f2d38;color:#fff;box-shadow:0 7px 16px rgba(31,45,56,.16)}
.print:hover{background:#121d25;box-shadow:0 9px 20px rgba(31,45,56,.22)}

.preview{min-width:0;max-width:100%;overflow:auto;padding-bottom:24px}
.sheet{width:210mm;height:297mm;padding:6mm;background:#fff;box-shadow:0 20px 50px rgba(30,43,54,.13)}
.grid{
  width:100%;height:100%;display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(7,1fr);
  gap:0;
  border:.22mm solid var(--line);
}

.coupon{
  position:relative;
  min-width:0;
  overflow:hidden;
  display:grid;
  grid-template-columns:25mm 1fr;
  background:var(--paper);
  border-right:.22mm solid var(--line);
  border-bottom:.22mm solid var(--line);
}
.coupon:nth-child(2n){border-right:none}
.coupon:nth-last-child(-n+2){border-bottom:none}

.stub{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--key-deep);
  border-right:.28mm dashed color-mix(in srgb,var(--key-mid) 65%,white);
}
.stub::before,.stub::after{
  content:"";position:absolute;z-index:2;right:-1.55mm;width:3mm;height:3mm;border-radius:50%;
  background:var(--paper)
}
.stub::before{top:-1.55mm}.stub::after{bottom:-1.55mm}
.brand-vertical{
  writing-mode:vertical-rl;transform:rotate(180deg);
  font-family:'DM Sans','Noto Sans KR',sans-serif;
  font-size:3.4mm;font-weight:700;line-height:1;letter-spacing:.16em;color:#fff;
  white-space:nowrap
}
.stub-code{position:absolute;left:50%;transform:translateX(-50%);font:600 1.75mm/1 'DM Sans',sans-serif;letter-spacing:.12em;color:color-mix(in srgb,#fff 62%,var(--key-mid));white-space:nowrap}
.stub-code.top{top:3.2mm}

.body{
  position:relative;
  min-width:0;
  display:grid;
  grid-template-rows:auto 1fr auto;
  align-items:stretch;
  padding:3.1mm 4.6mm 3mm 5mm;
  color:var(--ink);
  background:
    linear-gradient(135deg,color-mix(in srgb,var(--key-pale) 55%,transparent),transparent 42%),
    var(--paper);
}
.body::after{content:"";position:absolute;right:2.8mm;top:2.8mm;width:1.5mm;height:1.5mm;border-top:.25mm solid var(--key-main);border-right:.25mm solid var(--key-main);opacity:.55}
.header{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:1.25mm;min-width:0}
.topline{width:100%;display:flex;align-items:center;justify-content:flex-start;gap:1.7mm;min-width:0}
.top-text{
  font-family:'DM Sans','Noto Sans KR',sans-serif;
  font-size:2.65mm;font-weight:700;line-height:1;color:var(--key-main);
  letter-spacing:.145em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.heart{width:1.7mm;height:1.7mm;flex:0 0 auto;border:.28mm solid var(--key-main);font-size:0;transform:rotate(45deg);opacity:.72}
.rule{width:100%;height:.2mm;background:color-mix(in srgb,var(--key-main) 34%,var(--paper))}

.center{
  width:100%;min-width:0;
  display:flex;align-items:center;justify-content:flex-start;
  padding:.7mm 0 .25mm;
}
.main-wrap{width:100%;min-width:0;text-align:left}
.title{
  margin:0;
  font-family:'Noto Sans KR',sans-serif;
  font-size:5.1mm;font-weight:800;line-height:1.1;color:var(--ink);
  letter-spacing:-.065em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.bottom{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:2.2mm;min-width:0}
.subbrand{
  flex:0 1 auto;min-width:0;
  font-family:'DM Sans','Noto Sans KR',sans-serif;
  font-size:2.05mm;font-weight:700;line-height:1;color:var(--key-deep);letter-spacing:.11em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase
}
.note{
  flex:0 1 auto;min-width:0;
  font-family:'Noto Sans KR',sans-serif;
  font-size:1.85mm;font-weight:500;line-height:1.1;color:var(--muted);
  letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

@page{size:A4 portrait;margin:0}
@media(max-width:1000px){.app{width:100%;grid-template-columns:minmax(0,1fr);padding:14px}.panel{position:static}.preview{padding-bottom:14px}}
@media print{
  html,body{width:210mm;height:297mm;margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel{display:none}.app{display:block;max-width:none;margin:0;padding:0}.preview{overflow:visible;padding:0}.sheet{width:210mm;height:297mm;margin:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="panel-head">
      <h1>면제권 편집</h1>
      <p>문구와 키 컬러를 수정한 뒤 A4로 인쇄하세요.</p>
    </div>

    <div class="field">
      <label for="keyColorText">키 컬러</label>
      <div class="color-row">
        <input id="keyColorText" type="text" value="#4D6B8A">
        <input id="keyColor" type="color" value="#4d6b8a">
      </div>
    </div>

    <div class="field"><label for="text1">브랜드</label><input id="text1" type="text" value="CANB MIDDLE"></div>
    <div class="field"><label for="text2">쿠폰 유형</label><input id="text2" type="text" value="Test Coupon"></div>
    <div class="field"><label for="text3">메인 문구</label><input id="text3" type="text" value="단어 재시 면제권"></div>
    <div class="field"><label for="text4">발행처</label><input id="text4" type="text" value="CANB 중등"></div>
    <div class="field"><label for="text5">사용 조건</label><input id="text5" type="text" value="[15점 이상일 때 사용 가능]"></div>

    <div class="actions">
      <button class="reset" id="resetBtn" type="button">초기화</button>
      <button class="print" type="button" onclick="window.print()">인쇄</button>
    </div>
  </aside>

  <main class="preview">
    <section class="sheet"><div class="grid" id="grid"></div></section>
  </main>
</div>

<script>
const defaults={color:'#4D6B8A',text1:'CANB MIDDLE',text2:'Test Coupon',text3:'단어 재시 면제권',text4:'CANB 중등',text5:'[15점 이상일 때 사용 가능]'};
const $=id=>document.getElementById(id);
const root=document.documentElement;
const grid=$('grid');

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function hexToHsl(hex){
  const raw=hex.replace('#','');let r=parseInt(raw.slice(0,2),16)/255,g=parseInt(raw.slice(2,4),16)/255,b=parseInt(raw.slice(4,6),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);let h=0,s=0,l=(max+min)/2;
  if(max!==min){const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);if(max===r)h=(g-b)/d+(g<b?6:0);else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6}
  return{h:h*360,s:s*100,l:l*100}
}
function hsl(h,s,l){return `hsl(${Math.round(h)} ${Math.max(0,Math.min(100,s)).toFixed(1)}% ${Math.max(0,Math.min(100,l)).toFixed(1)}%)`}
function applyPalette(hex){
  const c=hexToHsl(hex);const baseS=Math.min(58,Math.max(24,c.s*.82));
  root.style.setProperty('--key',hex);
  root.style.setProperty('--key-deep',hsl(c.h,Math.max(26,baseS*.82),24));
  root.style.setProperty('--key-main',hsl(c.h,Math.max(24,baseS*.76),42));
  root.style.setProperty('--key-mid',hsl(c.h,Math.max(16,baseS*.44),70));
  root.style.setProperty('--key-soft',hsl(c.h,Math.max(10,baseS*.25),90));
  root.style.setProperty('--key-pale',hsl(c.h,Math.max(7,baseS*.18),96));
}
function render(){
  const v=[1,2,3,4,5].map(n=>$('text'+n).value);
  grid.innerHTML=Array.from({length:14},(_,i)=>`
    <article class="coupon">
      <div class="stub">
        <span class="stub-code top">NO. ${String(i+1).padStart(2,'0')}</span>
        <div class="brand-vertical">${esc(v[0])}</div>
      </div>
      <div class="body">
        <div class="header">
          <div class="topline"><div class="top-text">${esc(v[1])}</div><div class="heart">♡</div></div>
          <div class="rule"></div>
        </div>
        <div class="center"><div class="main-wrap"><h2 class="title">${esc(v[2])}</h2></div></div>
        <div class="bottom"><div class="subbrand">${esc(v[3])}</div><div class="note">${esc(v[4])}</div></div>
      </div>
    </article>`).join('');
}
[1,2,3,4,5].forEach(n=>$('text'+n).addEventListener('input',render));
$('keyColor').addEventListener('input',e=>{const v=e.target.value.toUpperCase();$('keyColorText').value=v;applyPalette(v)});
$('keyColorText').addEventListener('change',e=>{const v=e.target.value.trim();if(/^#[0-9a-fA-F]{6}$/.test(v)){$('keyColor').value=v;$('keyColorText').value=v.toUpperCase();applyPalette(v)}else{$('keyColorText').value=$('keyColor').value.toUpperCase()}});
$('resetBtn').addEventListener('click',()=>{[1,2,3,4,5].forEach(n=>$('text'+n).value=defaults['text'+n]);$('keyColor').value=defaults.color;$('keyColorText').value=defaults.color;applyPalette(defaults.color);render()});
applyPalette(defaults.color);render();
</script>
</body>
</html>
