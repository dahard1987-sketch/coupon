<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>면제권 A4</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Caveat:wght@600;700&family=Gaegu:wght@400;700&display=swap');

:root{
  --key:#9eb7d5;
  --key-deep:#5d7191;
  --key-main:#7f98b7;
  --key-mid:#b7c9de;
  --key-soft:#dfe8f2;
  --key-pale:#eef3f7;
  --paper:#ffffff;
  --screen:#efefef;
  --ink:#4f5670;
  --stub-line:#8a95a8;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--screen);
  color:var(--ink);
  min-height:100%;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-family:'Gaegu','Apple SD Gothic Neo',sans-serif;
}
body{min-height:100vh}

.app{
  max-width:1360px;
  margin:0 auto;
  padding:20px;
  display:grid;
  grid-template-columns:270px 1fr;
  gap:20px;
  align-items:start;
}

.panel{
  position:sticky;
  top:20px;
  background:#fff;
  border:1px solid #e2e6ed;
  border-radius:14px;
  padding:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.05);
}
.panel h1{
  margin:0 0 14px;
  font:700 15px/1.2 'Baloo 2',sans-serif;
  color:#4f5561;
}
.field{margin-bottom:12px}
.field label{
  display:block;
  margin-bottom:6px;
  font:700 11px/1.2 'Baloo 2',sans-serif;
  color:#6b7280;
}
.field input[type="text"]{
  width:100%;
  height:40px;
  padding:0 11px;
  border:1px solid #d5dae2;
  border-radius:8px;
  background:#fff;
  color:#2c3140;
  font:400 15px/1 'Gaegu',sans-serif;
  outline:none;
}
.field input[type="text"]:focus{
  border-color:var(--key-main);
  box-shadow:0 0 0 3px rgba(120,145,180,.14);
}
.color-row{
  display:grid;
  grid-template-columns:1fr 46px;
  gap:8px;
}
.color-row input[type="color"]{
  width:46px;
  height:40px;
  padding:3px;
  border:1px solid #d5dae2;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
}
.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;
}
button{
  height:40px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font:700 13px/1 'Baloo 2',sans-serif;
}
.reset{background:#eef1f4;color:#353b46}
.print{background:var(--key-deep);color:#fff}

.preview{overflow:auto;padding-bottom:20px}
.sheet{
  width:210mm;
  height:297mm;
  padding:7mm;
  background:var(--paper);
  box-shadow:0 14px 40px rgba(0,0,0,.10);
}
.grid{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(6,1fr);
  gap:0;
}

.coupon{
  position:relative;
  overflow:hidden;
  min-width:0;
  display:grid;
  grid-template-columns:32mm 1fr;
  background:linear-gradient(90deg, var(--key-soft) 0%, color-mix(in srgb,var(--key-soft) 56%, var(--key-pale)) 40%, var(--key-pale) 100%);
  border-right:.28mm solid rgba(90,100,120,.22);
  border-bottom:.28mm solid rgba(90,100,120,.22);
}
.coupon:nth-child(2n){border-right:0}
.coupon:nth-last-child(-n+2){border-bottom:0}

.stub{
  position:relative;
  background:linear-gradient(180deg, color-mix(in srgb,var(--key-mid) 86%, white) 0%, color-mix(in srgb,var(--key-main) 86%, white) 100%);
  display:flex;
  align-items:center;
  justify-content:center;
}
.stub::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  right:0;
  border-right:.35mm dashed var(--stub-line);
}
.brand-vertical{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font:700 11px/1 'Baloo 2',sans-serif;
  letter-spacing:.08em;
  color:var(--key-deep);
  text-align:center;
}
.barcode{
  position:absolute;
  top:50%;
  right:6.7mm;
  width:8mm;
  height:24mm;
  transform:translateY(-50%);
  opacity:.7;
  background:repeating-linear-gradient(
    180deg,
    #414a58 0 .42mm,
    transparent .42mm .9mm,
    #414a58 .9mm 1.15mm,
    transparent 1.15mm 1.55mm,
    #414a58 1.55mm 2.25mm,
    transparent 2.25mm 2.7mm
  );
}

.body{
  position:relative;
  padding:3.2mm 6.5mm 3mm;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  min-width:0;
}
.header{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.7mm;
}
.topline{
  width:100%;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:2.5mm;
}
.top-text{
  font:700 7.2mm/.95 'Caveat',cursive;
  letter-spacing:.01em;
  color:var(--key-deep);
  white-space:nowrap;
}
.heart{
  font:700 3.6mm/1 'Caveat',cursive;
  color:color-mix(in srgb,var(--key-deep) 76%, #73795f);
  transform:translateY(.6mm);
}
.rule{
  width:100%;
  height:.38mm;
  border-radius:999px;
  background:color-mix(in srgb,var(--key-deep) 58%, #8d795d);
  opacity:.76;
}
.center{
  flex:1;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2.8mm;
  padding-top:.8mm;
}
.main-wrap{
  flex:1;
  min-width:0;
  text-align:center;
}
.title{
  margin:0;
  font:700 6.2mm/1.02 'Gaegu',sans-serif;
  letter-spacing:-.025em;
  color:color-mix(in srgb,var(--key-deep) 72%, #55447f);
}
.subbrand{
  margin-top:1.1mm;
  font:700 3.2mm/1 'Gaegu',sans-serif;
  color:color-mix(in srgb,var(--key-deep) 82%, #5d557d);
  letter-spacing:.045em;
}
.note{
  margin-top:.9mm;
  font:400 2.65mm/1.12 'Gaegu',sans-serif;
  color:color-mix(in srgb,var(--key-deep) 72%, #5e6278);
}
.pencils{
  position:relative;
  width:14mm;
  height:14mm;
  flex:none;
}
.pencil{
  position:absolute;
  width:3.6mm;
  height:10.9mm;
  border-radius:1.8mm;
  background:linear-gradient(180deg,#e9a0b1 0 78%, #3d4350 78% 84%, #f2ead9 84% 100%);
  box-shadow:inset 0 0 0 .22mm rgba(0,0,0,.04);
}
.pencil::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1.5mm;
  background:#c9bd69;
  border-radius:1.8mm 1.8mm 0 0;
}
.pencil::after{
  content:"";
  position:absolute;
  inset:1.7mm 1mm 2mm 1mm;
  background:repeating-linear-gradient(180deg, rgba(255,255,255,.14) 0 .3mm, rgba(255,255,255,0) .3mm .8mm);
}
.pencil.one{right:5.6mm;top:.8mm;transform:rotate(25deg)}
.pencil.two{right:.8mm;top:4.3mm;transform:rotate(33deg)}

@page{size:A4 portrait;margin:0}
@media (max-width:1100px){
  .app{grid-template-columns:1fr;padding:16px}
  .panel{position:static}
}
@media print{
  html,body{
    width:210mm;
    height:297mm;
    margin:0;
    background:#fff;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .panel{display:none}
  .app{display:block;max-width:none;margin:0;padding:0}
  .preview{overflow:visible;padding:0}
  .sheet{width:210mm;height:297mm;box-shadow:none;margin:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>편집</h1>
    <div class="field">
      <label for="keyColorText">키 컬러</label>
      <div class="color-row">
        <input id="keyColorText" type="text" value="#9EB7D5">
        <input id="keyColor" type="color" value="#9eb7d5">
      </div>
    </div>
    <div class="field">
      <label for="text1">문구 1</label>
      <input id="text1" type="text" value="CANB MIDDLE">
    </div>
    <div class="field">
      <label for="text2">문구 2</label>
      <input id="text2" type="text" value="Test Coupon">
    </div>
    <div class="field">
      <label for="text3">문구 3</label>
      <input id="text3" type="text" value="단어 재시 면제권">
    </div>
    <div class="field">
      <label for="text4">문구 4</label>
      <input id="text4" type="text" value="CANB 중등">
    </div>
    <div class="field">
      <label for="text5">문구 5</label>
      <input id="text5" type="text" value="[15점 이상일 때 사용 가능]">
    </div>
    <div class="actions">
      <button class="reset" id="resetBtn" type="button">초기화</button>
      <button class="print" type="button" onclick="window.print()">인쇄</button>
    </div>
  </aside>

  <main class="preview">
    <section class="sheet">
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>

<script>
const defaults={
  color:'#9EB7D5',
  text1:'CANB MIDDLE',
  text2:'Test Coupon',
  text3:'단어 재시 면제권',
  text4:'CANB 중등',
  text5:'[15점 이상일 때 사용 가능]'
};

const $=id=>document.getElementById(id);
const root=document.documentElement;
const grid=$('grid');

function esc(v){
  return String(v).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function hexToHsl(hex){
  const raw=hex.replace('#','');
  let r=parseInt(raw.slice(0,2),16)/255;
  let g=parseInt(raw.slice(2,4),16)/255;
  let b=parseInt(raw.slice(4,6),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h=0,s=0,l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>0.5? d/(2-max-min): d/(max+min);
    switch(max){
      case r: h=(g-b)/d+(g<b?6:0); break;
      case g: h=(b-r)/d+2; break;
      default: h=(r-g)/d+4;
    }
    h/=6;
  }
  return {h:h*360,s:s*100,l:l*100};
}

function hsl(h,s,l){
  return `hsl(${Math.round(h)} ${Math.max(0,Math.min(100,s)).toFixed(1)}% ${Math.max(0,Math.min(100,l)).toFixed(1)}%)`;
}

function applyPalette(hex){
  const c=hexToHsl(hex);
  const baseS=Math.min(30, Math.max(12, c.s*0.34));
  root.style.setProperty('--key', hex);
  root.style.setProperty('--key-deep', hsl(c.h, Math.max(18, baseS*1.2), 42));
  root.style.setProperty('--key-main', hsl(c.h, Math.max(16, baseS), 62));
  root.style.setProperty('--key-mid', hsl(c.h, Math.max(12, baseS*0.7), 79));
  root.style.setProperty('--key-soft', hsl(c.h, Math.max(10, baseS*0.45), 89));
  root.style.setProperty('--key-pale', hsl(c.h, Math.max(8, baseS*0.32), 94));
  root.style.setProperty('--stub-line', hsl(c.h, Math.max(14, baseS*0.8), 56));
}

function render(){
  const vals=[1,2,3,4,5].map(n=>$("text"+n).value);
  grid.innerHTML=Array.from({length:12},()=>`
    <article class="coupon">
      <div class="stub">
        <div class="brand-vertical">${esc(vals[0])}</div>
        <div class="barcode"></div>
      </div>
      <div class="body">
        <div class="header">
          <div class="topline">
            <div class="top-text">${esc(vals[1])}</div>
            <div class="heart">♡</div>
          </div>
          <div class="rule"></div>
        </div>
        <div class="center">
          <div class="main-wrap">
            <h2 class="title">${esc(vals[2])}</h2>
            <div class="subbrand">${esc(vals[3])}</div>
            <div class="note">${esc(vals[4])}</div>
          </div>
          <div class="pencils"><div class="pencil one"></div><div class="pencil two"></div></div>
        </div>
      </div>
    </article>
  `).join('');
}

[1,2,3,4,5].forEach(n=>$("text"+n).addEventListener('input',render));
$("keyColor").addEventListener('input',e=>{
  const v=e.target.value.toUpperCase();
  $("keyColorText").value=v;
  applyPalette(v);
});
$("keyColorText").addEventListener('change',e=>{
  const v=e.target.value.trim();
  if(/^#[0-9a-fA-F]{6}$/.test(v)){
    $("keyColor").value=v;
    $("keyColorText").value=v.toUpperCase();
    applyPalette(v);
  }else{
    $("keyColorText").value=$("keyColor").value.toUpperCase();
  }
});
$("resetBtn").addEventListener('click',()=>{
  [1,2,3,4,5].forEach(n=>$("text"+n).value=defaults['text'+n]);
  $("keyColor").value=defaults.color;
  $("keyColorText").value=defaults.color;
  applyPalette(defaults.color);
  render();
});
applyPalette(defaults.color);
render();
</script>
</body>
</html>
