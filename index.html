<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>면제권 A4</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap');

@font-face{
  font-family:'Cafe24Ssurround';
  font-weight:700;
  font-style:normal;
  src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2108@1.1/Cafe24Ssurround.woff') format('woff');
}

@font-face{
  font-family:'SUIT';
  font-weight:100 900;
  font-style:normal;
  src:url('https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.woff2') format('woff2-variations');
}

:root{
  --key:#7ea9d7;
  --key-deep:#4d6d93;
  --key-main:#6f96c0;
  --key-mid:#a8bfd8;
  --key-soft:#d9e5f1;
  --key-pale:#edf3f8;
  --ink:#1a1c20;
  --muted:#67707d;
  --line:#d5dbe4;
  --paper:#ffffff;
  --screen:#f2f3f5;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--screen);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-family:"SUIT","Apple SD Gothic Neo",sans-serif;
}

body{min-height:100vh}

.app{
  max-width:1480px;
  margin:0 auto;
  padding:24px;
  display:grid;
  grid-template-columns:280px 1fr;
  gap:24px;
  align-items:start;
}

.panel{
  position:sticky;
  top:24px;
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:14px;
  padding:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.05);
}

.panel h1{
  margin:0 0 14px;
  font-family:"Outfit",sans-serif;
  font-size:15px;
  font-weight:800;
  letter-spacing:-.02em;
}

.field{margin-bottom:12px}

.field label{
  display:block;
  margin-bottom:6px;
  font-family:"Outfit",sans-serif;
  font-size:11px;
  font-weight:800;
  color:#68717d;
}

.field input[type="text"]{
  width:100%;
  height:40px;
  padding:0 11px;
  border:1px solid #d5dae2;
  border-radius:8px;
  background:#fff;
  color:#1b1f25;
  font:inherit;
  font-size:14px;
  outline:none;
}

.field input[type="text"]:focus{
  border-color:var(--key-mid);
  box-shadow:0 0 0 3px rgba(126,169,215,.16);
}

.color-row{
  display:grid;
  grid-template-columns:1fr 46px;
  gap:8px;
}

.color-row input[type="color"]{
  width:46px;
  height:40px;
  padding:3px;
  border:1px solid #d5dae2;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;
}

button{
  height:40px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-family:"Outfit",sans-serif;
  font-size:13px;
  font-weight:800;
}

.reset{background:#eef1f4;color:#30343b}
.print{background:var(--key-deep);color:#fff}

.preview{overflow:auto;padding-bottom:20px}

.sheet{
  width:297mm;
  height:210mm;
  padding:7mm;
  background:var(--paper);
  box-shadow:0 14px 40px rgba(0,0,0,.10);
}

.grid{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,1fr);
  gap:0;
  border:.35mm solid var(--line);
}

.coupon{
  position:relative;
  display:grid;
  grid-template-columns:31mm 1fr;
  min-width:0;
  background:#fff;
  border-right:.35mm solid var(--line);
  border-bottom:.35mm solid var(--line);
}

.coupon:nth-child(2n){border-right:none}
.coupon:nth-last-child(-n+2){border-bottom:none}

.stub{
  position:relative;
  background:var(--key-soft);
  border-right:.35mm dashed color-mix(in srgb, var(--key-deep) 52%, white);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.stub::before,
.stub::after{
  content:"";
  position:absolute;
  right:-2.2mm;
  width:4.2mm;
  height:4.2mm;
  border-radius:50%;
  background:#fff;
  border:.35mm solid var(--line);
}

.stub::before{top:-2.25mm}
.stub::after{bottom:-2.25mm}

.stub-text{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-family:"Outfit",sans-serif;
  font-size:11.2px;
  font-weight:700;
  letter-spacing:.20em;
  color:var(--key-deep);
  text-transform:uppercase;
}

.body{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  text-align:center;
  padding:5.5mm 9mm 5.5mm;
}

.topline{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:12px;
}

.topline-text{
  font-family:"Outfit",sans-serif;
  font-size:7.2px;
  font-weight:600;
  letter-spacing:.11em;
  color:var(--key-main);
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-align:left;
  flex:1;
}

.dot{
  flex:none;
  width:2.2mm;
  height:2.2mm;
  border-radius:50%;
  background:var(--key-main);
}

.center{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  padding:2.5mm 0 1mm;
}

.title{
  margin:0;
  font-family:"Cafe24Ssurround","SUIT",sans-serif;
  font-size:23.4px;
  line-height:1.08;
  font-weight:700;
  letter-spacing:-.045em;
  color:var(--key-deep);
}

.rule{
  width:18mm;
  height:.52mm;
  margin:3.1mm 0 2.6mm;
  border-radius:999px;
  background:var(--key-main);
}

.note{
  margin:0;
  font-size:9.5px;
  line-height:1.42;
  font-weight:600;
  letter-spacing:-.02em;
  color:var(--muted);
}

.bottom{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  gap:1.4mm;
  padding-top:2mm;
}

.brand{
  font-family:"Cafe24Ssurround","SUIT",sans-serif;
  font-size:11.4px;
  line-height:1.1;
  font-weight:700;
  letter-spacing:-.025em;
  color:var(--key-deep);
}

.footnote{
  font-size:8.8px;
  line-height:1.32;
  font-weight:500;
  letter-spacing:-.015em;
  color:var(--muted);
}

@page{
  size:A4 landscape;
  margin:0;
}

@media (max-width:1100px){
  .app{
    grid-template-columns:1fr;
    padding:16px;
  }
  .panel{position:static}
}

@media print{
  html,body{
    width:297mm;
    height:210mm;
    background:#fff;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
    margin:0;
  }

  .panel{display:none}
  .app{
    display:block;
    max-width:none;
    margin:0;
    padding:0;
  }
  .preview{
    overflow:visible;
    padding:0;
  }
  .sheet{
    width:297mm;
    height:210mm;
    margin:0;
    box-shadow:none;
  }
}
</style>
</head>

<body>
<div class="app">
  <aside class="panel">
    <h1>편집</h1>

    <div class="field">
      <label for="colorText">키 컬러</label>
      <div class="color-row">
        <input id="colorText" type="text" value="#7EA9D7">
        <input id="colorInput" type="color" value="#7ea9d7">
      </div>
    </div>

    <div class="field">
      <label for="text1">문구 1</label>
      <input id="text1" type="text" value="RETEST PASS">
    </div>

    <div class="field">
      <label for="text2">문구 2</label>
      <input id="text2" type="text" value="WORD TEST COUPON">
    </div>

    <div class="field">
      <label for="text3">문구 3</label>
      <input id="text3" type="text" value="단어 재시 면제권">
    </div>

    <div class="field">
      <label for="text4">문구 4</label>
      <input id="text4" type="text" value="CANB 중등">
    </div>

    <div class="field">
      <label for="text5">문구 5</label>
      <input id="text5" type="text" value="15점 이상일 때 사용 가능">
    </div>

    <div class="actions">
      <button class="reset" id="resetBtn" type="button">초기화</button>
      <button class="print" type="button" onclick="window.print()">인쇄</button>
    </div>
  </aside>

  <main class="preview">
    <section class="sheet">
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>

<script>
const defaults = {
  color: "#7EA9D7",
  text1: "RETEST PASS",
  text2: "WORD TEST COUPON",
  text3: "단어 재시 면제권",
  text4: "CANB 중등",
  text5: "15점 이상일 때 사용 가능"
};

const $ = (id) => document.getElementById(id);
const grid = $("grid");

function esc(v){
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function hexToHsl(hex){
  hex = hex.replace('#','');
  let r = parseInt(hex.substring(0,2),16)/255;
  let g = parseInt(hex.substring(2,4),16)/255;
  let b = parseInt(hex.substring(4,6),16)/255;

  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max + min) / 2;

  if(max === min){
    h = s = 0;
  } else {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch(max){
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      default: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }

  return {
    h: Math.round(h * 360),
    s: Math.round(s * 100),
    l: Math.round(l * 100)
  };
}

function hsl(h,s,l){
  return `hsl(${h} ${s}% ${l}%)`;
}

function applyTheme(hex){
  const {h, s, l} = hexToHsl(hex);

  const satMain = Math.max(24, Math.min(48, Math.round(s * 0.55)));
  const satSoft = Math.max(16, Math.min(28, Math.round(s * 0.32)));
  const satPale = Math.max(12, Math.min(20, Math.round(s * 0.20)));
  const satDeep = Math.max(28, Math.min(42, Math.round(s * 0.48)));

  document.documentElement.style.setProperty('--key', hex);
  document.documentElement.style.setProperty('--key-deep', hsl(h, satDeep, 40));
  document.documentElement.style.setProperty('--key-main', hsl(h, satMain, 58));
  document.documentElement.style.setProperty('--key-mid', hsl(h, Math.max(18, Math.round(satMain * 0.75)), 76));
  document.documentElement.style.setProperty('--key-soft', hsl(h, satSoft, 88));
  document.documentElement.style.setProperty('--key-pale', hsl(h, satPale, 95));
}

function render(){
  const color = $("colorInput").value;
  const text1 = $("text1").value;
  const text2 = $("text2").value;
  const text3 = $("text3").value;
  const text4 = $("text4").value;
  const text5 = $("text5").value;

  applyTheme(color);

  grid.innerHTML = Array.from({length:6}, () => `
    <article class="coupon">
      <div class="stub">
        <div class="stub-text">${esc(text1)}</div>
      </div>
      <div class="body">
        <div class="topline">
          <div class="topline-text">${esc(text2)}</div>
          <div class="dot"></div>
        </div>

        <div class="center">
          <h2 class="title">${esc(text3)}</h2>
          <div class="rule"></div>
          <p class="note">${esc(text5)}</p>
        </div>

        <div class="bottom">
          <div class="brand">${esc(text4)}</div>
        </div>
      </div>
    </article>
  `).join("");
}

["text1","text2","text3","text4","text5"].forEach(id => {
  $(id).addEventListener("input", render);
});

$("colorInput").addEventListener("input", e => {
  $("colorText").value = e.target.value.toUpperCase();
  render();
});

$("colorText").addEventListener("change", e => {
  const v = e.target.value.trim();
  if(/^#[0-9A-Fa-f]{6}$/.test(v)){
    $("colorInput").value = v;
    render();
  }else{
    e.target.value = $("colorInput").value.toUpperCase();
  }
});

$("resetBtn").addEventListener("click", () => {
  $("colorInput").value = defaults.color;
  $("colorText").value = defaults.color;
  $("text1").value = defaults.text1;
  $("text2").value = defaults.text2;
  $("text3").value = defaults.text3;
  $("text4").value = defaults.text4;
  $("text5").value = defaults.text5;
  render();
});

render();
</script>
</body>
</html>
