<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>면제권 A4</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Do+Hyeon&family=Gowun+Dodum&display=swap');

:root{
  --key:#6558d3;
  --key-deep:#42369f;
  --key-main:#6558d3;
  --key-mid:#8e84df;
  --key-soft:#dedaf5;
  --key-pale:#f4f2fc;
  --ink:#17191d;
  --muted:#666d78;
  --line:#d9dee6;
  --paper:#fff;
  --screen:#f3f4f6;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--screen);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;
}

body{min-height:100vh}

.app{
  max-width:1480px;
  margin:0 auto;
  padding:24px;
  display:grid;
  grid-template-columns:270px 1fr;
  gap:24px;
  align-items:start;
}

.panel{
  position:sticky;
  top:24px;
  background:#fff;
  border:1px solid #e4e8ef;
  border-radius:14px;
  padding:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.05);
}

.panel h1{
  margin:0 0 14px;
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.02em;
}

.field{margin-bottom:12px}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:11px;
  font-weight:700;
  color:#69717d;
}

.field input[type="text"]{
  width:100%;
  height:40px;
  padding:0 11px;
  border:1px solid #d5dae2;
  border-radius:8px;
  background:#fff;
  color:#1b1f25;
  font:inherit;
  font-size:14px;
  outline:none;
}

.field input[type="text"]:focus{
  border-color:var(--key-mid);
  box-shadow:0 0 0 3px var(--key-pale);
}

.color-row{
  display:grid;
  grid-template-columns:1fr 46px;
  gap:8px;
}

.color-row input[type="color"]{
  width:46px;
  height:40px;
  padding:3px;
  border:1px solid #d5dae2;
  border-radius:8px;
  background:#fff;
  cursor:pointer;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px;
}

button{
  height:40px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-family:"Gowun Dodum",sans-serif;
  font-size:13px;
  font-weight:700;
}

.reset{background:#eef1f4;color:#30343b}
.print{background:var(--key-deep);color:#fff}

.preview{overflow:auto;padding-bottom:20px}

.sheet{
  width:297mm;
  height:210mm;
  padding:7mm;
  background:var(--paper);
  box-shadow:0 14px 40px rgba(0,0,0,.10);
}

.grid{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,1fr);
  gap:0;
  border:.35mm solid var(--line);
}

.coupon{
  position:relative;
  display:grid;
  grid-template-columns:31mm 1fr;
  min-width:0;
  background:#fff;
  border-right:.35mm solid var(--line);
  border-bottom:.35mm solid var(--line);
}

.coupon:nth-child(2n){border-right:none}
.coupon:nth-last-child(-n+2){border-bottom:none}

.stub{
  position:relative;
  background:var(--key-pale);
  border-right:.35mm dashed var(--key-mid);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.stub::before,
.stub::after{
  content:"";
  position:absolute;
  right:-2.2mm;
  width:4.2mm;
  height:4.2mm;
  border-radius:50%;
  background:#fff;
  border:.35mm solid var(--line);
}

.stub::before{top:-2.25mm}
.stub::after{bottom:-2.25mm}

.stub-text{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.25em;
  color:var(--key-deep);
  text-transform:uppercase;
}

.body{
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:7mm 9mm;
}

.brand{
  position:absolute;
  top:4.7mm;
  left:7mm;
  font-family:"Do Hyeon",sans-serif;
  font-size:8.6px;
  letter-spacing:.015em;
  color:var(--key-deep);
}

.topline{
  position:absolute;
  top:5mm;
  right:12mm;
  max-width:62mm;
  text-align:right;
  font-family:"Bricolage Grotesque",sans-serif;
  font-size:7px;
  font-weight:700;
  letter-spacing:.18em;
  color:var(--key-mid);
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.dot{
  position:absolute;
  top:5.1mm;
  right:6mm;
  width:2.2mm;
  height:2.2mm;
  border-radius:50%;
  background:var(--key-main);
}

.title{
  margin:0;
  font-family:"Do Hyeon","Apple SD Gothic Neo",sans-serif;
  font-size:24px;
  line-height:1.08;
  font-weight:400;
  letter-spacing:-.035em;
  color:var(--key-deep);
}

.rule{
  width:19mm;
  height:.55mm;
  margin:3.1mm 0 2.6mm;
  border-radius:999px;
  background:var(--key-main);
}

.note{
  margin:0;
  font-family:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  font-size:9.5px;
  line-height:1.4;
  font-weight:400;
  letter-spacing:-.015em;
  color:var(--muted);
}

@page{
  size:A4 landscape;
  margin:0;
}

@media(max-width:1100px){
  .app{grid-template-columns:1fr;padding:16px}
  .panel{position:static}
}

@media print{
  html,body{
    width:297mm;
    height:210mm;
    background:#fff;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }

  .panel{display:none}
  .app{display:block;max-width:none;margin:0;padding:0}
  .preview{overflow:visible;padding:0}
  .sheet{width:297mm;height:210mm;margin:0;box-shadow:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Coupon Editor</h1>

    <div class="field">
      <label for="text1">문구 1</label>
      <input id="text1" type="text" value="CANB 중등">
    </div>

    <div class="field">
      <label for="text2">문구 2</label>
      <input id="text2" type="text" value="RETEST PASS">
    </div>

    <div class="field">
      <label for="text3">문구 3</label>
      <input id="text3" type="text" value="WORD TEST COUPON">
    </div>

    <div class="field">
      <label for="text4">문구 4</label>
      <input id="text4" type="text" value="단어 재시 면제권">
    </div>

    <div class="field">
      <label for="text5">문구 5</label>
      <input id="text5" type="text" value="15점 이상일 때 사용 가능">
    </div>

    <div class="field">
      <label for="keyColorText">키 컬러</label>
      <div class="color-row">
        <input id="keyColorText" type="text" value="#6558D3">
        <input id="keyColor" type="color" value="#6558d3">
      </div>
    </div>

    <div class="actions">
      <button class="reset" id="resetBtn" type="button">초기화</button>
      <button class="print" type="button" onclick="window.print()">인쇄</button>
    </div>
  </aside>

  <main class="preview">
    <section class="sheet">
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>

<script>
const defaults={
  text1:"CANB 중등",
  text2:"RETEST PASS",
  text3:"WORD TEST COUPON",
  text4:"단어 재시 면제권",
  text5:"15점 이상일 때 사용 가능",
  color:"#6558D3"
};

const $=id=>document.getElementById(id);
const root=document.documentElement;
const grid=$("grid");

function esc(v){
  return String(v).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function hexToHsl(hex){
  const raw=hex.replace("#","");
  const r=parseInt(raw.slice(0,2),16)/255;
  const g=parseInt(raw.slice(2,4),16)/255;
  const b=parseInt(raw.slice(4,6),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0,s=0;
  const l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>.5?d/(2-max-min):d/(max+min);
    if(max===r)h=(g-b)/d+(g<b?6:0);
    else if(max===g)h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h/=6;
  }
  return {h:h*360,s:s*100,l:l*100};
}

function hsl(h,s,l){
  return `hsl(${Math.round(h)} ${Math.max(0,Math.min(100,s)).toFixed(1)}% ${Math.max(0,Math.min(100,l)).toFixed(1)}%)`;
}

function applyPalette(hex){
  const c=hexToHsl(hex);
  root.style.setProperty("--key",hex);
  root.style.setProperty("--key-deep",hsl(c.h,Math.max(30,c.s*.82),Math.max(24,c.l*.58)));
  root.style.setProperty("--key-main",hsl(c.h,Math.max(40,c.s*.95),Math.min(58,c.l)));
  root.style.setProperty("--key-mid",hsl(c.h,Math.max(28,c.s*.58),Math.min(72,c.l+18)));
  root.style.setProperty("--key-soft",hsl(c.h,Math.max(18,c.s*.30),91));
  root.style.setProperty("--key-pale",hsl(c.h,Math.max(12,c.s*.20),97));
}

function render(){
  const v=[1,2,3,4,5].map(n=>$("text"+n).value);
  grid.innerHTML=Array.from({length:6},()=>`
    <article class="coupon">
      <div class="stub">
        <div class="stub-text">${esc(v[1])}</div>
      </div>
      <div class="body">
        <div class="brand">${esc(v[0])}</div>
        <div class="topline">${esc(v[2])}</div>
        <div class="dot"></div>
        <h2 class="title">${esc(v[3])}</h2>
        <div class="rule"></div>
        <p class="note">${esc(v[4])}</p>
      </div>
    </article>
  `).join("");
}

[1,2,3,4,5].forEach(n=>$("text"+n).addEventListener("input",render));

$("keyColor").addEventListener("input",e=>{
  const value=e.target.value.toUpperCase();
  $("keyColorText").value=value;
  applyPalette(value);
});

$("keyColorText").addEventListener("change",e=>{
  const value=e.target.value.trim();
  if(/^#[0-9a-fA-F]{6}$/.test(value)){
    $("keyColor").value=value;
    e.target.value=value.toUpperCase();
    applyPalette(value);
  }else{
    e.target.value=$("keyColor").value.toUpperCase();
  }
});

$("resetBtn").addEventListener("click",()=>{
  [1,2,3,4,5].forEach(n=>$("text"+n).value=defaults["text"+n]);
  $("keyColor").value=defaults.color;
  $("keyColorText").value=defaults.color;
  applyPalette(defaults.color);
  render();
});

applyPalette(defaults.color);
render();
</script>
</body>
</html>
